<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="js/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="design-system/industry-88dd333b-711c-41d8-81c0-9075dff1aa78/styles.css">
<script src="design-system/industry-88dd333b-711c-41d8-81c0-9075dff1aa78/_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  a { color: var(--color-accent-700); text-decoration: none; }
  a:hover { color: var(--color-accent-800); }
  @keyframes il-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes il-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes il-trail { from { stroke-dashoffset: 134; } to { stroke-dashoffset: 0; } }
  @keyframes il-pulse { 0%,100% { transform: scale(0.7); opacity: 0.5; } 50% { transform: scale(1.3); opacity: 0; } }
  .il-pulse { transform-box: fill-box; transform-origin: center; animation: il-pulse 2.8s ease-out infinite; }
</style>
</helmet>

<div style="position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;">
  <div style="position: absolute; inset: 0; background-image: linear-gradient(to right, var(--color-divider) 1px, transparent 1px), linear-gradient(to bottom, var(--color-divider) 1px, transparent 1px); background-size: 96px 96px; opacity: 0.35; mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 20%, transparent 78%);"></div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 38px; padding: 0 32px;">
    <div style="display: flex; align-items: center; gap: 16px; animation: il-rise 0.9s cubic-bezier(0.2,0.7,0.2,1) both;">
      <svg width="46" height="46" viewBox="0 0 46 46" fill="none" stroke="var(--color-accent)" stroke-width="1.5" aria-hidden="true">
        <rect x="1" y="1" width="44" height="44" stroke="var(--color-divider)"></rect>
        <path d="M11 33 L22 33 Q30 33 30 25 L30 13" stroke-linecap="square"></path>
        <circle cx="11" cy="33" r="3.2" fill="var(--color-bg)"></circle>
        <rect x="26" y="9" width="8" height="8" fill="var(--color-accent)" stroke="none"></rect>
      </svg>
      <div style="font-family: var(--font-heading); font-weight: 600; font-size: 46px; line-height: 0.95; letter-spacing: 0.02em; text-transform: uppercase;">
        <span>Indus</span><span style="color: var(--color-accent-700);">Logix</span>
      </div>
    </div>

    <svg width="620" height="150" viewBox="0 0 620 150" fill="none" style="max-width: 86vw; height: auto; animation: il-fade 1.2s ease both 0.25s;" aria-hidden="true">
      <path id="il-route" d="M46 112 C 170 112 176 38 300 38 C 424 38 456 96 574 58" pathLength="100" stroke="var(--color-neutral-300)" stroke-width="1.5" stroke-dasharray="5 6"></path>
      <path d="M46 112 C 170 112 176 38 300 38 C 424 38 456 96 574 58" pathLength="100" stroke="var(--color-accent)" stroke-width="1.75" stroke-dasharray="34 100" style="animation: il-trail 4.4s linear infinite;"></path>

      <g stroke="var(--color-accent)" stroke-width="1.5">
        <circle class="il-pulse" cx="46" cy="112" r="14" fill="var(--color-accent)" stroke="none"></circle>
        <circle cx="46" cy="112" r="5.5" fill="var(--color-bg)"></circle>
        <circle cx="300" cy="38" r="4" fill="var(--color-bg)" stroke="var(--color-neutral-400)"></circle>
        <circle class="il-pulse" cx="574" cy="58" r="14" fill="var(--color-accent)" stroke="none" style="animation-delay: 1.4s;"></circle>
        <circle cx="574" cy="58" r="5.5" fill="var(--color-bg)"></circle>
      </g>

      <g>
        <animateMotion dur="4.4s" repeatCount="indefinite" rotate="auto" calcMode="linear"><mpath href="#il-route"></mpath></animateMotion>
        <rect x="-8" y="-8" width="16" height="16" fill="var(--color-accent)"></rect>
        <path d="M-8 -2 L8 -2" stroke="var(--color-bg)" stroke-width="1.25"></path>
      </g>

      <g stroke="var(--color-divider)" stroke-width="1">
        <path d="M46 128 L46 138 M574 74 L574 138"></path>
        <path d="M40 138 L580 138" stroke-dasharray="2 5"></path>
      </g>
    </svg>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 30px; animation: il-rise 1s cubic-bezier(0.2,0.7,0.2,1) both 0.45s;">
      <div style="font-size: 17px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 62%, transparent);">Logistics, simplified.</div>
      <a class="btn btn-primary blueprint" href="pages/company-setup.html" style="padding: 13px 30px; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-bg);">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <span>Get started</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
      </a>
    </div>
  </div>

  <div style="position: absolute; bottom: 40px; left: 0; right: 0; display: flex; justify-content: center; animation: il-fade 1.2s ease both 0.8s;">
    <div style="font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 45%, transparent);">Powered by IndusSoft</div>
  </div>
</div>
</x-dc>
</body>
</html>
